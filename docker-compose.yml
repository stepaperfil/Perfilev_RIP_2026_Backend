version: "3.8"

services:
  minio:
    image: minio/minio:latest
    container_name: tco-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  postgres:
    image: postgres:16
    container_name: tco-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: tco
      POSTGRES_USER: tco
      POSTGRES_PASSWORD: tco
    volumes:
      - postgres-data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: tco-adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres

volumes:
  minio-data:
  postgres-data:
