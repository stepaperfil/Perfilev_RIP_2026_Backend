name: tco-minio

services:
  minio:
    image: minio/minio:latest
    container_name: tco-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

volumes:
  minio-data:
    external: true
    name: tco-backend_minio-data
