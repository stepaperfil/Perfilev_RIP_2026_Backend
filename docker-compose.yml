name: tco-db

services:
  postgres:
    image: postgres:16
    container_name: tco-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: tco
      POSTGRES_USER: tco
      POSTGRES_PASSWORD: tco
    volumes:
      - postgres-data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: tco-adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres

volumes:
  postgres-data:
