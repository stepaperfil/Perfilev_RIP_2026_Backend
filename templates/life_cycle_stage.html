<html lang="ru">
<head>
    <title>{{ .lifeCycleStage.Title }} — Лента</title>
    <link rel="stylesheet" href="/static/styles/common.css?v={{ assetVersion }}">
    <link rel="stylesheet" href="/static/styles/life_cycle_stage_style.css?v={{ assetVersion }}">
</head>
<div class="app">
    <div class="feed">
        {{ if .videoURL }}
        <video class="feed-media" src="{{ .videoURL }}" autoplay muted loop playsinline></video>
        {{ else }}
        <img class="feed-media" src="{{ .imageURL }}" alt="{{ .lifeCycleStage.Title }}">
        {{ end }}
        <div class="feed-overlay">
            <div class="feed-likes">
                <div class="feed-likes-static">
                    <span class="feed-likes-icon">💚</span>
                    <span class="feed-likes-count">{{ .likesCount }}</span>
                </div>
                <a class="btn btn-icon feed-next" href="/life_cycle_stages/{{ .lifeCycleStage.ID }}?next=true" aria-label="Следующий этап">→</a>
            </div>

            <h1 class="feed-title">{{ .lifeCycleStage.Title }}</h1>

            <div class="feed-params">
                <div class="feed-param">
                    <span class="feed-param-label">ЦЕНА ЗА ЕДИНИЦУ</span>
                    <span class="feed-param-value">{{ formatPrice .lifeCycleStage.PricePerUnit }} ₽</span>
                </div>
                <div class="feed-param">
                    <span class="feed-param-label">ПОРЯДКОВЫЙ НОМЕР</span>
                    <span class="feed-param-value">{{ .lifeCycleStage.StagePosition }}</span>
                </div>
            </div>

            <div class="feed-description">
                <input type="checkbox" id="desc-toggle" class="feed-description-toggle-input">
                <p class="feed-description-text">{{ .lifeCycleStage.Description }}</p>
                <label for="desc-toggle" class="feed-description-toggle">
                    <span class="label-more">Подробнее</span>
                    <span class="label-less">Скрыть</span>
                </label>
            </div>
        </div>
    </div>
    <nav class="tabbar">
        <a class="tabbar-active" href="/life_cycle_stages/1">Лента<span class="tabbar-dot"></span></a>
        <a href="/life_cycle_stages/draft">Добавление</a>
        <a href="/life_cycle_stages">Плитка</a>
    </nav>
</div>
</html>
